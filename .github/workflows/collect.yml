name: Collect gym counts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC); the script skips hours outside 7 AM-11 PM Eastern
  workflow_dispatch:          # adds a "Run workflow" button for testing

concurrency: gym-collect

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python gym_runner.py
      - name: Save new data
        run: |
          git config user.name "gym-bot"
          git config user.email "gym-bot@users.noreply.github.com"
          git add main_data.csv
          git diff --cached --quiet || (git commit -m "Update gym counts" && git push)
