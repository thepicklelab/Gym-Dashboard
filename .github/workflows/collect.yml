name: Collect gym counts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: gym-collect

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Match file names
        run: cp cgym_helpers.py gym_helpers.py
      - run: python cgym_runner.py
      - name: Save new data
        run: |
          git config user.name "gym-bot"
          git config user.email "gym-bot@users.noreply.github.com"
          git add main_data.csv
          git diff --cached --quiet || (git commit -m "Update gym counts" && git push)
